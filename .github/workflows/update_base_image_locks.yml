name: Update deterministic base-image locks

on:
  push:
    branches: [main]
    paths:
      - 'notebooks/**/configuration.yaml'
      - '.tools/python_tools/base_image_lock.py'
      - 'docker/Dockerfile*'
  workflow_dispatch:
    inputs:
      refresh_existing:
        description: 'Intentionally refresh existing base-image digests to the current upstream images'
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: base-image-locks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Add missing immutable base-image digests
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.refresh_existing }}
        run: python3 .tools/python_tools/base_image_lock.py --repo-root . ensure-all

      - name: Intentionally refresh all base-image digests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_existing }}
        run: python3 .tools/python_tools/base_image_lock.py --repo-root . refresh-all

      - name: Validate complete base-image lock
        run: python3 .tools/python_tools/base_image_lock.py --repo-root . check-all --require-platform-metadata

      - name: Detect lock changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- .tools/base_images.lock.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated base-image lock
        if: ${{ steps.changes.outputs.changed == 'true' }}
        shell: bash
        run: |
          git add -- .tools/base_images.lock.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update deterministic base-image lock"
          git push

      - name: Rebuild published images after intentional refresh
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_existing && steps.changes.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build_docker_images_all.yml --ref main
