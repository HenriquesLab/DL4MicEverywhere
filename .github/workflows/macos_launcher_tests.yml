name: macOS launcher tests

on:
  pull_request:
    paths:
      - 'MacOS_launch.command'
      - 'Linux_launch.sh'
      - 'launcher.py'
      - 'launcher.spec'
      - '.tools/bash_tools/**'
      - '.tools/python_tools/tests/**'
      - '.github/workflows/macos_launcher_tests.yml'
  push:
    branches:
      - main
      - improve_gui
    paths:
      - 'MacOS_launch.command'
      - 'Linux_launch.sh'
      - 'launcher.py'
      - 'launcher.spec'
      - '.tools/bash_tools/**'
      - '.tools/python_tools/tests/**'
      - '.github/workflows/macos_launcher_tests.yml'
  workflow_dispatch:

jobs:
  launcher-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run launcher regression tests on macOS
        run: python -m pytest -q .tools/python_tools/tests .tools/tests .tools/windows_tools/tests
      - name: Parse all shell launchers with macOS Bash
        run: |
          while IFS= read -r -d '' file; do
            /bin/bash -n "$file"
          done < <(find . -type f \( -name '*.sh' -o -name '*.command' \) -print0)
